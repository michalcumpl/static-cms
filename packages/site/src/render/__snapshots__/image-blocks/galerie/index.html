<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galerie – Pekárna U Lípy</title>
    <link rel="stylesheet" href="/assets/style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-name" href="/">Pekárna U Lípy</a>
        <nav class="site-nav">
          <ul>
            <li><a href="/">Úvod</a></li>
            <li><a href="/kontakt/">Kontakt</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <h1 class="page-title">Galerie</h1>
      </div>
      <section class="block text-with-image image-left">
        <div class="container twi-inner">
          <div class="twi-text">
          <h2>Dárkový poukaz</h2>
          <p>Dárkový poukaz udělá radost každému malému umělci.</p>
          <ul>
            <li>Platí rok od koupě</li>
            <li>Na jakýkoli kroužek</li>
          </ul>
          </div>
          <div class="twi-image"><img src="/assets/images/hero.png-320.webp" srcset="/assets/images/hero.png-320.webp 320w" sizes="(min-width: 48rem) 50vw, 100vw" alt="Dárkový poukaz ateliéru" width="320" height="180" loading="lazy"></div>
        </div>
      </section>
      <section class="block gallery">
        <div class="container">
          <h2>Jak pracujeme</h2>
          <ul class="gallery-grid">
            <li>
              <figure>
                <a href="/assets/images/hero.png-320.webp"><img src="/assets/images/hero.png-320.webp" srcset="/assets/images/hero.png-320.webp 320w" sizes="(min-width: 48rem) 33vw, 50vw" alt="Děti při práci 1" width="320" height="180" loading="lazy"></a>
                <figcaption>Malování na plátno</figcaption>
              </figure>
            </li>
            <li>
              <figure>
                <a href="/assets/images/hero.png-320.webp"><img src="/assets/images/hero.png-320.webp" srcset="/assets/images/hero.png-320.webp 320w" sizes="(min-width: 48rem) 33vw, 50vw" alt="Děti při práci 2" width="320" height="180" loading="lazy"></a>
              </figure>
            </li>
            <li>
              <figure>
                <a href="/assets/images/hero.png-320.webp"><img src="/assets/images/hero.png-320.webp" srcset="/assets/images/hero.png-320.webp 320w" sizes="(min-width: 48rem) 33vw, 50vw" alt="Děti při práci 3" width="320" height="180" loading="lazy"></a>
                <figcaption>Keramická dílna</figcaption>
              </figure>
            </li>
          </ul>
        </div>
      </section>
      <section class="block team">
        <div class="container">
          <h2>Kdo jsme</h2>
          <ul class="team-list">
            <li class="person">
              <img class="portrait" src="/assets/images/hero.png-320.webp" srcset="/assets/images/hero.png-320.webp 320w" sizes="10rem" alt="" width="320" height="180" loading="lazy">
              <h3 class="person-name">Kateřina</h3>
              <p class="person-role">lektorka</p>
              <p class="person-text">Vede kroužky malování.</p>
            </li>
            <li class="person">
              <h3 class="person-name">Martina</h3>
            </li>
          </ul>
        </div>
      </section>
      <section class="block logos">
        <div class="container">
          <h2>Podporují nás</h2>
          <ul class="logo-row">
            <li><a href="https://harmonie.example"><img src="/assets/images/hero.png-320.webp" srcset="/assets/images/hero.png-320.webp 320w" sizes="12rem" alt="Nadace Harmonie" width="320" height="180" loading="lazy"></a></li>
            <li><a href="/kontakt/"><img src="/assets/images/hero.png-320.webp" srcset="/assets/images/hero.png-320.webp 320w" sizes="12rem" alt="Praha 6" width="320" height="180" loading="lazy"></a></li>
          </ul>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>© Pekárna U Lípy</p>
      </div>
    </footer>
  </body>
</html>
