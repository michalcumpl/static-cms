<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scénografie</title>
    <link rel="stylesheet" href="/assets/style.css">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Scénografie">
    <meta property="og:title" content="Scénografie">
    <meta name="twitter:card" content="summary">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-name" href="/">Scénografie</a>
        <nav class="site-nav">
          <ul>
            <li><a href="/vystavy/">Výstavy</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <h1 class="page-title">Úvod</h1>
      </div>
      <section class="block cards cards-over">
        <div class="container">
          <h2>Projekty</h2>
          <ul class="card-list card-columns-4">
            <li class="card">
              <img class="card-image" src="/assets/images/tile-0.jpg-1200.webp" srcset="/assets/images/tile-0.jpg-480.webp 480w, /assets/images/tile-0.jpg-960.webp 960w, /assets/images/tile-0.jpg-1200.webp 1200w" sizes="(min-width: 44rem) 33vw, 100vw" alt="TV a film" width="1200" height="900" loading="lazy">
              <h3 class="card-title"><a href="/vystavy/">TV a film</a></h3>
            </li>
            <li class="card">
              <img class="card-image" src="/assets/images/tile-1.jpg-1200.webp" srcset="/assets/images/tile-1.jpg-480.webp 480w, /assets/images/tile-1.jpg-960.webp 960w, /assets/images/tile-1.jpg-1200.webp 1200w" sizes="(min-width: 44rem) 33vw, 100vw" alt="Eventy" width="1200" height="900" loading="lazy">
              <h3 class="card-title"><a href="/vystavy/">Eventy</a></h3>
            </li>
            <li class="card">
              <img class="card-image" src="/assets/images/tile-2.jpg-1200.webp" srcset="/assets/images/tile-2.jpg-480.webp 480w, /assets/images/tile-2.jpg-960.webp 960w, /assets/images/tile-2.jpg-1200.webp 1200w" sizes="(min-width: 44rem) 33vw, 100vw" alt="Výstavy" width="1200" height="900" loading="lazy">
              <h3 class="card-title"><a href="/vystavy/">Výstavy</a></h3>
            </li>
            <li class="card">
              <img class="card-image" src="/assets/images/tile-3.jpg-1200.webp" srcset="/assets/images/tile-3.jpg-480.webp 480w, /assets/images/tile-3.jpg-960.webp 960w, /assets/images/tile-3.jpg-1200.webp 1200w" sizes="(min-width: 44rem) 33vw, 100vw" alt="Interiéry" width="1200" height="900" loading="lazy">
              <h3 class="card-title"><a href="/vystavy/">Interiéry</a></h3>
            </li>
          </ul>
        </div>
      </section>
      <section class="block cards cards-below">
        <div class="container">
          <ul class="card-list card-columns-2">
            <li class="card">
              <img class="card-image" src="/assets/images/a1.jpg-1200.webp" srcset="/assets/images/a1.jpg-480.webp 480w, /assets/images/a1.jpg-960.webp 960w, /assets/images/a1.jpg-1200.webp 1200w" sizes="(min-width: 44rem) 33vw, 100vw" alt="Cena" width="1200" height="900" loading="lazy">
              <h2 class="card-title">Designblok 2020</h2>
              <p class="card-text">Hlavní cena za <em>expozici</em>.</p>
            </li>
            <li class="card card-no-image">
              <h2 class="card-title"><a href="/realizace/petrof-160/">PETROF 160</a></h2>
              <p class="card-text"><a href="https://ntm.cz">Muzeum</a> a výstava.</p>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="footer-business">
          <address class="contact-details">
            <p>Černokostelecká 90<br>Praha</p>
            <p><a href="https://www.google.com/maps/search/?api=1&amp;query=%C4%8Cernokosteleck%C3%A1%2090%2C%20Praha%2C%20CZ">Zobrazit na mapě</a></p>
          </address>
        </div>
        <p>© Scénografie</p>
      </div>
    </footer>
  </body>
</html>
