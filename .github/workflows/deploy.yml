name: Deploy

# Deploys the admin (admin-on-aws design.md decision 6): after CI succeeds on main, to every
# stack in the repository variable DEPLOY_STACKS (a JSON list such as ["dev"]); or by hand, any
# branch to one stack. Each stack's job runs in the GitHub environment of that name, whose
# variables AWS_DEPLOY_ROLE_ARN and ECR_REPOSITORY are the stack's outputs (infra/README.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: The stack to deploy to
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  stacks:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
    steps:
      - id: pick
        env:
          DISPATCHED: ${{ inputs.stack }}
          CONFIGURED: ${{ vars.DEPLOY_STACKS }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            echo "stacks=[\"$DISPATCHED\"]" >> "$GITHUB_OUTPUT"
          else
            echo "stacks=${CONFIGURED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: stacks
    if: needs.stacks.outputs.stacks != '[]'
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    runs-on: ubuntu-24.04-arm
    environment: ${{ matrix.stack }}
    concurrency:
      group: deploy-${{ matrix.stack }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      # The commit CI checked, or the one dispatched.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      STACK: ${{ matrix.stack }}
      REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      # Tags are immutable, so a commit already built is deployed as it is.
      - id: built
        run: |
          if aws ecr describe-images --repository-name "${REPOSITORY#*/}" \
            --image-ids "imageTag=$SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.built.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.built.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REPOSITORY }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run webmio-deploy on the server
        timeout-minutes: 15
        run: |
          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:webmio-admin,Values=$STACK" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$instance" ]; then
            echo "::error::No running server for the $STACK stack."
            exit 1
          fi
          command=$(aws ssm send-command --instance-ids "$instance" \
            --document-name AWS-RunShellScript --comment "Deploy $SHA" --timeout-seconds 600 \
            --parameters "{\"commands\":[\"/usr/local/bin/webmio-deploy $SHA\"]}" \
            --query Command.CommandId --output text)
          while :; do
            status=$(aws ssm get-command-invocation --command-id "$command" \
              --instance-id "$instance" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          if [ "$status" != Success ]; then
            echo "::error::The deploy of $SHA to $STACK ended with $status."
            exit 1
          fi
