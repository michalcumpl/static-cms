name: webmio-hosting
description: Webmio hosting, the bucket and the edge that serve published websites (own-hosting).
runtime:
  name: nodejs
  options:
    # The program is compiled by `pnpm --filter @webmio/infra build`; TypeScript 7 has no
    # compiler API for Pulumi's built-in TypeScript support.
    typescript: false
    packagemanager: pnpm
main: dist/index.js
config:
  sitesDomain:
    type: string
    description: The free addresses' domain; websites get <name>.<sitesDomain>.
  netDomain:
    type: string
    description: Webmio's own domain; websites' CNAME targets are <name>.sites.<netDomain>.
  adminDomain:
    type: string
    description: The admin's address, served by its server over HTTPS.
  adminZone:
    type: string
    default: ""
    description: The Route 53 zone for adminDomain's A record; empty when its DNS is elsewhere.
  alertEmail:
    type: string
    description: Where alarms are emailed.
  githubProvider:
    type: string
    default: create
    description: "create, or existing when another stack in the account created GitHub's OIDC provider."
  redirectServer:
    type: boolean
    default: true
    description: Whether to run the redirect server that answers customers' bare domains.
  localAdminUser:
    type: boolean
    default: false
    description: Whether to create the IAM user for running the admin locally against this stack.
