config:
  aws:region: eu-central-1
  # Subdomains of the production domains, delegated to this stack's zones (infra/README.md).
  webmio-hosting:sitesDomain: dev.webmio.site
  webmio-hosting:netDomain: dev.webmio.net
  # The admin's server (admin-on-aws). Its record goes in the dev.webmio.net zone above.
  webmio-hosting:adminDomain: app.dev.webmio.net
  webmio-hosting:adminZone: dev.webmio.net
  # Keeps the IAM user for running the admin on a laptop against this stack.
  webmio-hosting:localAdminUser: "true"
  webmio-hosting:adminSecretKey:
    secure: v1:JPdLC2n2cpAPwFx4:jDuNSpfokJu9SoMHPBAQ0eNZS4rSby7I1PdSZxK1jPf6uIXv6QSH+cESLxXkjaf4RAjN5WX3iQvHqKszjdy4TtKzuEHVvOoOPtvHGD6wM4M=
