packages:
  - apps/*
  - packages/*
  - tooling/*
  - infra

# Install scripts pnpm may run: better-sqlite3 builds or fetches its native SQLite binding,
# esbuild (used by tsx and drizzle-kit) checks its platform binary.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Pulumi's protobufjs only checks its CLI's dependencies after install; nothing to build.
  protobufjs: false

catalog:
  # Webmio hosting from the admin (own-hosting design.md decision 8). The key-value store's
  # client signs with SigV4a, which needs the signer installed beside it.
  "@aws-sdk/client-cloudfront": 3.1140.0
  "@aws-sdk/client-cloudfront-keyvaluestore": 3.1140.0
  "@aws-sdk/client-s3": 3.1140.0
  "@aws-sdk/client-sesv2": 3.1140.0
  "@aws-sdk/signature-v4a": 3.1138.0
  "@biomejs/biome": 2.5.14
  # The admin's own interface font (admin-foundation design.md decision 3), SIL Open Font Licence.
  "@fontsource-variable/dm-sans": 5.3.0
  # The site's webfonts (theme-and-branding design.md decision 2), all SIL Open Font Licence.
  # Pinned exactly: packages/site/src/fonts.ts copies their file names and unicode ranges, and
  # published sites ship their bytes, so upgrade them deliberately and together.
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/lora": 5.3.0
  "@fontsource-variable/merriweather": 5.3.0
  "@fontsource-variable/nunito": 5.3.0
  "@fontsource-variable/playfair-display": 5.3.0
  "@fontsource-variable/source-sans-3": 5.3.0
  "@fontsource-variable/source-serif-4": 5.3.0
  "@fontsource-variable/work-sans": 5.3.0
  "@playwright/test": ^1.63.0
  # Webmio hosting's infrastructure program (own-hosting design.md decision 13).
  "@pulumi/aws": 7.47.0
  "@pulumi/pulumi": 3.263.0
  "@sveltejs/adapter-node": ^5.5.7
  "@sveltejs/kit": ^2.70.3
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^22.0.0
  "@types/nodemailer": ^8.0.2
  # 13.x's prebuilt binary crashes (segfault) when opening a database on Node 22.13; 12.x works.
  better-sqlite3: ^12.11.1
  # The importer's HTML and CSS parsers (site-import design decision 2). Pinned exactly: they read
  # websites we don't control, so upgrade them deliberately, with the import fixtures.
  cheerio: 1.2.0
  css-tree: 3.2.1
  "@types/css-tree": 3.2.0
  # cheerio's node types, which it doesn't re-export; the version cheerio itself uses.
  domhandler: 5.0.3
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.3
  fflate: ^0.8.3
  html-validate: ^9.7.1
  # LGPL-3.0: loaded as its own chunk, only when a HEIC photo needs converting.
  libheif-js: ^1.23.2
  nodemailer: ^10.0.12
  sharp: ^0.35.5
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  # Pre-1.0 and changing quickly: pinned exactly, upgrade deliberately.
  svedit: 0.14.0
  tsx: ^4.23.15
  turbo: ^2.11.5
  typescript: ^7.0.2
  vite: ^8.3.1
  vitest: ^5.0.2

catalogs:
  # SvelteKit and svelte-check need TypeScript's JavaScript compiler API, which TypeScript 7
  # only offers as unstable/*. The SvelteKit app uses this catalog until they support 7.
  typescript6:
    typescript: ^6.0.3

# html-validate only uses vitest for its optional test matchers, which we don't use.
peerDependencyRules:
  allowedVersions:
    html-validate>vitest: "5"
